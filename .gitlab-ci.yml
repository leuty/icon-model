include:
  - local: .gitlab/ci/utils/log.yml
  - local: .gitlab/ci/utils/pip.yml
  - local: .gitlab/ci/common/alpine.yml
  - local: .gitlab/ci/common/pre-commit.yml
  - local: .gitlab/ci/common/html.yml

workflow:
  rules:
    - if: $CI_PROJECT_PATH == "icon/icon-model"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none

stages:
  - basic
  - test
  - system

variables:
  ICON_CI_PARENT_PIPELINE_SOURCE: ${CI_PIPELINE_SOURCE}

default:
  interruptible: true

Licenses:
  stage: basic
  extends: .common:pre-commit
  script:
    - |
      icon_ci_log_section_start 'Checking licenses' 'collapsed=false'
      (
        set -ux
        pre-commit run --color=always --hook-stage manual reuse || {
          icon_ci_log_error_msg \
            "You can reproduce this check locally with \`pre-commit run --hook-stage manual reuse\`.
      See also ${CI_PROJECT_URL}/-/blob/${CI_DEFAULT_BRANCH}/CONTRIBUTING.md#coding-style."
          exit 1
        } 2>/dev/null
        # The check_license.py script does not ignore git submodules:
        git submodule --quiet deinit --force --all 2>/dev/null
        "${CI_PROJECT_DIR}/scripts/ci_scripts/check_license.py"
      ) 2>&1
      icon_ci_log_section_end
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

Coding Style:
  stage: basic
  extends: .common:pre-commit
  variables:
    STYLE_PATCH: style.patch
  script:
    - |
      icon_ci_log_section_start 'Checking coding style' 'collapsed=false'
      (
        set -ux
        pre-commit run --color=always --all-files
      ) 2>&1 || {
        git diff --ignore-submodules --patch-with-raw > "${STYLE_PATCH}" && {
          test -s "${STYLE_PATCH}" && {
            icon_ci_log_error_msg "The issues can be resolved with the patch (see artifacts):
        ${CI_JOB_URL}/artifacts/raw/${STYLE_PATCH}."
          } || {
            icon_ci_log_error_msg "The issues cannot be resolved with a patch."
            rm -f "${STYLE_PATCH}"
          }
        } || {
          icon_ci_log_error_msg "Failed to generate a patch file."
          rm -f "${STYLE_PATCH}"
        }
        icon_ci_log_error_msg \
          "You can reproduce this check locally with \`pre-commit run --all-files\`.
      See also ${CI_PROJECT_URL}/-/blob/${CI_DEFAULT_BRANCH}/CONTRIBUTING.md#coding-style."
        exit 1
      }
      icon_ci_log_section_end
  artifacts:
    paths:
      - ${STYLE_PATCH}
    expire_in: 1 day
    when: on_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

General Style:
  stage: basic
  extends: .common:alpine
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    # TODO: we should check all ICON source files, as well as all source files
    # of the bundled libraries that are built as part of ICON:
    #   - externals/art
    #   - externals/dace_icon
    #   - externals/emvorado
    #   - externals/jsbach
    # However, we cannot currently do that because they will fail the tests.
    # Therefore, we check as many of them as possible:
    GIT_SUBMODULE_PATHS: externals/art externals/jsbach
    ICON_CI_COMMON_ALPINE_PACKAGES: >-
      bash findutils grep py3-click py3-numpy py3-pandas py3-yaml python3
    ICON_SRC_PATHS: src support test/unit-tests
  script:
    - |
      icon_ci_log_section_start 'Checking general style' 'collapsed=false'
      (
        set -ux
        "${CI_PROJECT_DIR}/scripts/ci_scripts/check_encoding.sh" ${ICON_SRC_PATHS} ${GIT_SUBMODULE_PATHS}
        "${CI_PROJECT_DIR}/scripts/ci_scripts/check_src_noexec.sh" ${ICON_SRC_PATHS} ${GIT_SUBMODULE_PATHS}
        "${CI_PROJECT_DIR}/scripts/ci_scripts/check_fortran.py" ${ICON_SRC_PATHS} ${GIT_SUBMODULE_PATHS}
        "${CI_PROJECT_DIR}/scripts/ci_scripts/check_granule_encapsulation.sh"
        python3 "${CI_PROJECT_DIR}/scripts/experiments/yaml_experiment_test_processor.py"
      ) 2>&1
      icon_ci_log_section_end
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

Autoconf:
  stage: basic
  extends: .common:alpine
  variables:
    AUTOCONF_VERSION: "2.69"
    AUTOCONF_SHA256: 954bd69b391edc12d6a4a51a2dd1476543da5c6bbf05a95b59dc0dd6fd4c2969
    AUTOCONF_DIR: ${ICON_CI_UTILS_GIT_IGNORE_PATH}/autoconf
    AUTOCONF_PATCH: autoconf.patch
    ICON_CI_COMMON_ALPINE_PACKAGES: automake curl git m4 make perl
  before_script:
    - !reference [.common:alpine, before_script]
    - |
      icon_ci_log_section_start 'Fetching Autoconf'
      test -f "${AUTOCONF_DIR}/autoconf-${AUTOCONF_VERSION}.tar.gz" && \
      echo "${AUTOCONF_SHA256} ${AUTOCONF_DIR}/autoconf-${AUTOCONF_VERSION}.tar.gz" | sha256sum -c || (
        set -ux
        mkdir -p "${AUTOCONF_DIR}"
        cd "${AUTOCONF_DIR}"
        curl -OL --connect-timeout 10 "https://ftpmirror.gnu.org/gnu/autoconf/autoconf-${AUTOCONF_VERSION}.tar.gz" || \
        curl -L -o "autoconf-${AUTOCONF_VERSION}.tar.gz" "https://mirror.spack.io/_source-cache/archive/${AUTOCONF_SHA256:0:2}/${AUTOCONF_SHA256}.tar.gz"
        echo "${AUTOCONF_SHA256} autoconf-${AUTOCONF_VERSION}.tar.gz" | sha256sum -c
      ) 2>&1 || {
        icon_ci_log_error_msg "Failed to fetch Autoconf ${AUTOCONF_VERSION}."
        exit 1
      }
      icon_ci_log_section_end
      icon_ci_log_section_start 'Installing Autoconf'
      (
        set -ux
        cd "${AUTOCONF_DIR}"
        tar xfz autoconf-${AUTOCONF_VERSION}.tar.gz --strip-components=1
        ./configure
        make -j4 install
      ) 2>&1 || {
        icon_ci_log_error_msg "Failed to install Autoconf ${AUTOCONF_VERSION}."
        exit 1
      }
      icon_ci_log_section_end
  script:
    - |
      icon_ci_log_section_start 'Checking consistency' 'collapsed=false'
      set -u
      ( set -x; autoreconf -fvi; ) 2>&1
      git diff --ignore-submodules --patch-with-raw > "${AUTOCONF_PATCH}" || {
        icon_ci_log_error_msg 'Failed to generate a patch file.'
        rm -f "${AUTOCONF_PATCH}"
        exit 1
      }
      test ! -s "${AUTOCONF_PATCH}" || {
        icon_ci_log_error_msg \
          "The automatically generated Autotools files (e.g. 'configure') \
      are inconsistent with 'configure.ac' and/or Autoconf ${AUTOCONF_VERSION}.
      The issue can be resolved with the patch (see artifacts):
        ${CI_JOB_URL}/artifacts/raw/${AUTOCONF_PATCH}."
          exit 1
      }
      icon_ci_log_section_end
  cache:
    - !reference [.common:alpine, cache]
    - key: autoconf-${AUTOCONF_SHA256}
      paths:
        - ${AUTOCONF_DIR}/autoconf-${AUTOCONF_VERSION}.tar.gz
  artifacts:
    paths:
      - ${AUTOCONF_PATCH}
    expire_in: 1 week
    when: on_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - config.h.in
        - configure
        - configure.ac
        - m4/**/*
        - utils/config.guess
        - utils/config.sub
        - utils/install-sh

Iconbot:
  stage: basic
  extends:
    - .utils:log
    - .utils:pip
  variables:
    ICONBOT_GIT_REPOSITORY_URL: >-
      https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.dkrz.de/icon/ci-tooling/iconbot.git
    ICONBOT_GIT_BRANCH: production
    ICONBOT_GIT_CLONE_PATH: ${CI_PROJECT_DIR}/iconbot
    ICONBOT_CONFIG_REL_PATH: .gitlab/iconbot/notifier.yml
    PIP_REQUIREMENT: ${ICONBOT_GIT_CLONE_PATH}/requirements/notifier/config.txt
  before_script:
    - !reference [.utils:log, before_script]
    - |
      icon_ci_log_section_start 'Fetching Iconbot'
      (
        set -ux
        git clone --branch "${ICONBOT_GIT_BRANCH}" --depth 1 \
          "${ICONBOT_GIT_REPOSITORY_URL}" "${ICONBOT_GIT_CLONE_PATH}"
      ) 2>&1
      icon_ci_log_section_end
    - !reference [.utils:pip, before_script]
  script:
    - |
      icon_ci_log_section_start 'Running Iconbot checks' 'collapsed=false'
      (
        set -ux
        python3 "${ICONBOT_GIT_CLONE_PATH}/src/notifier/config.py" \
          "${CI_PROJECT_DIR}/${ICONBOT_CONFIG_REL_PATH}"
      ) 2>&1
      icon_ci_log_section_end
  tags:
    # A random runner with Python3 and PIP:
    - sphinx
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ${ICONBOT_CONFIG_REL_PATH}

Namelist Overview:
  stage: basic
  script:
    - cd doc/Namelist_overview
    - pdflatex Namelist_overview.tex
    # needs to be called a 2nd time for generating the ToC
    - pdflatex Namelist_overview.tex
  artifacts:
    paths:
      - doc/Namelist_overview/Namelist_overview.pdf
  tags:
    - latex
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - doc/Namelist_overview/*.tex

Generate HTML:
  extends: .common:html
  stage: basic
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    url: ${ICON_CI_COMMON_HTML_ARTIFACT_URL}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.common:html, rules, changes]

Generate and publish HTML:
  extends: .common:html
  stage: basic
  pages:
    publish: ${ICON_CI_COMMON_HTML_OUTPUT_REL_PATH}
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: !reference [.common:html, rules, changes]
  manual_confirmation: This job updates the GitLab Pages of the current project

Granules:
  stage: test
  needs: []
  trigger:
    include: .gitlab/ci/granules.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/granules.yml
        - externals/fortran-support
        - externals/iconmath
        - externals/probtest
        - src/atm_phy_schemes/mo_lookup_tables_constants.f90
        - src/atm_phy_schemes/mo_thdyn_functions.f90
        - src/atm_phy_schemes/mo_2mom_mcrph_types.f90
        - src/atm_phy_schemes/mo_2mom_mcrph_setup.f90
        - src/configure_model/mo_2mom_mcrph_config.f90
        - src/granules/microphysics_1mom_schemes/**/*
        - src/shared/mo_kind.f90
        - src/shared/mo_physical_constants.f90
        - src/shared/mo_impl_constants.f90
        - src/shared/mo_impl_constants_grf.f90
        - test/microphysics_1mom_schemes/**/*

Ragnarok:
  stage: test
  needs: []
  trigger:
    include: .gitlab/ci/ragnarok.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/ragnarok.yml
        - externals/kokkos
        - ragnarok/**/*

santis:
  stage: system
  needs: []
  trigger:
    include: .gitlab/ci/cscs/santis.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        ICON_TEST_SCHEDULE: ${ICON_TEST_SCHEDULE}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/cscs/**/*
        - scripts/cscs_ci/**/*
      when: manual
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_PROJECT_PATH != "icon/icon-mpim"
      when: manual

levante:
  stage: system
  needs: []
  trigger:
    include: .gitlab/ci/levante.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
