workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
 - test
 - granules

.colorized:
  variables:
    DEFAULT: '\033[0m'
    RED: '\033[0;31m'

Check OpenACC Style:
  extends: .colorized

  variables:
    BEAUTIFIER_TAG: "v0.3.0"
    BEAUTIFIER_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.dkrz.de/dwd-sw/icon-openacc-beautifier.git"
    GIT_SUBMODULE_STRATEGY: none

  before_script:
    - git clone --branch "${BEAUTIFIER_TAG}" --depth 1 "${BEAUTIFIER_REPO}"

  script:
    # Apply beautifier:
    - python3 icon-openacc-beautifier/main.py src/
    # Build git patch:
    - git diff --ignore-submodules --patch-with-raw > acc_style.patch
    - |
      # Test if patching is necessary:
      test ! -s acc_style.patch || {
        printf "${RED}ERROR: There are ACC style errors. Please check your \
      code. You might want to run the ACC beautifier or \`git apply acc_style.patch\` \
      (see artifacts).${DEFAULT}\n" >&2
        exit 1
      }

  tags:
    # Choose python capable runner:
    - sphinx

  artifacts:
    paths:
      - acc_style.patch
    expire_in: 1 week
    expose_as: 'OpenACC Style Git Patch'
    when: on_failure

Check Style:
  variables:
    GIT_SUBMODULE_STRATEGY: normal

  script:
    # TODO: we should check all ICON source files, as well as all source files
    # of the bundled libraries that are built as part of ICON:
    #   - externals/art
    #   - externals/dace_icon
    #   - externals/emvorado
    #   - externals/jsbach
    # However, we cannot currently do that because they will fail the tests.
    # Therefore, we check as many of them as possible:
    - ./scripts/ci_scripts/check_encoding.sh 'src' 'support'
    - ./scripts/ci_scripts/check_src_noexec.sh 'src' 'support'
    - ./scripts/ci_scripts/check_omp_sentinels.sh 'src' 'support' 'externals/jsbach' 'externals/emvorado' 'externals/art'
    - ./scripts/ci_scripts/check_license.sh
    - ./scripts/ci_scripts/check_granule_encapsulation.sh

  tags:
    # Choose a runner with GNU find, GNU grep and bash:
    - conda

Check Autoreconf:
  extends: .colorized

  variables:
    AUTOCONF_VERSION: "2.69"
    GIT_SUBMODULE_STRATEGY: none

  before_script:
    - apk add --no-cache automake curl git m4 make perl
    - |
      # Installing Autoconf
      (
        set -eux
        mkdir autoconf && cd autoconf
        curl -L https://de.freedif.org/gnu/autoconf/autoconf-${AUTOCONF_VERSION}.tar.gz | tar xz --strip-components=1
        ./configure && make -j4 && make install
      )

  script:
    - autoreconf -fvi
    - git diff --ignore-submodules --patch-with-raw > autoreconf.patch
    - |
      # Checking the consistency
      test ! -s autoreconf.patch || {
        printf "${RED}ERROR: the automatically generated Autotools files \
      (e.g. 'configure') are inconsistent with 'configure.ac' and/or \
      Autoconf ${AUTOCONF_VERSION} (see artifacts)${DEFAULT}\n" >&2
        exit 1
      }

  tags:
    - alpine

  artifacts:
    paths:
      - autoreconf.patch
    expire_in: 1 week
    expose_as: 'Autoreconf Git Patch'
    when: on_failure

GCC Microphysics 1-moment:
  stage: granules
  before_script:
    - . /sw/etc/profile.levante && module use /sw/spack-levante/spack/modules && module list
    # add ci-token to gitliab links
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.dkrz.de/".insteadOf "git@gitlab.dkrz.de:"
    - git config --global --add safe.directory '*'
  script:
    - module load git && git submodule init externals/probtest && git submodule update externals/probtest
    - module load gcc/11.2.0-gcc-11.2.0 netcdf-fortran/4.5.3-gcc-11.2.0 python3
    - pip install -v -r externals/probtest/requirements.txt
    - mkdir gcc
    - cd gcc
    - cmake ../test/microphysics_1mom_schemes/  -DCMAKE_C_COMPILER=gcc -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_CXX_COMPILER=g++ -DNETCDF_DIR=/sw/spack-levante/netcdf-fortran-4.5.3-l2ulgp -DBUILD_TESTING=OFF -DBUILD_OPENACC=OFF
    - make VERBOSE=1
    - ctest --output-on-failure
  tags:
    - levante-fake, hpc, dkrz
  # Run only for branches that are part of a merge request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true

