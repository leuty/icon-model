include:
  - scripts/cscs_ci/remote.yml

.setup_python:
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -r scripts/cscs_ci/requirements.txt

.setup_uenv:
  script:
    - uenv repo create
    - uenv image pull icon-wcp/v1:rc4

.configure_with_uenv:
  script:
    - uenv run icon-wcp/v1:rc4 -- ./config/cscs/${CONFIG}

.check_with_uenv:
  script:
    - uenv run icon-wcp/v1:rc4 -- ./icon-dev.checksuite

.todi_create_common:
  extends: .baremetal-runner-todi-gh200 
  stage: .pre
  timeout: 1h
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - !reference [.setup_python, script]
  script:
    - ./scripts/cscs_ci/cscs_ci_from_yml --tag ${TAG} --builder ${BUILDER}
  artifacts:
    paths:
      - pipeline.yml

.trigger_common:
  trigger:
    include:
      - artifact: pipeline.yml
        job: create-pipeline
    strategy: depend
    forward:
      pipeline_variables: true

.build_common_todi:
  extends: .baremetal-runner-todi-gh200
  stage: build
  timeout: 2h
  artifacts:
    paths:
    - config.log
    - run/**/*
    - scripts/**/*
    - make_runscripts
    - bin/icon
    - externals/ecrad/data
    - externals/probtest/**/*
    - data/**/*
    when: always
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
    CSCS_REWRITE_RELATIVE_SUBMODULES: 'YES'
    # needed for to pick correct header in collect.set-up.info
    HOST: todi

.build_todi_cpu_nvhpc:
  variables:
    CONFIG: todi.cpu.nvhpc
  extends: .build_common_todi
  before_script:
    - !reference [.setup_uenv, script]
  script:
    - !reference [.configure_with_uenv, script]

.build_todi_gpu_nvhpc:
  extends: .build_common_todi
  variables:
    CONFIG: todi.gpu.nvhpc
  before_script:
    - !reference [.setup_uenv, script]
  script:
    - !reference [.configure_with_uenv, script]

.run_common_todi:
  extends: .baremetal-runner-todi-gh200 
  timeout: 1h
  stage: run
  dependencies:
    - build_icon
  before_script:
    - !reference [.setup_python, script]
  script:
    - echo use_builddir=$(pwd) >> run/set-up.info
    - cd run
    - rundir=$(pwd)
    - cd checksuite.icon-dev
    - !reference [.check_with_uenv, script]
  variables:
    GIT_STRATEGY: none
