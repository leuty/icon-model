include:
  - scripts/cscs_ci/remote.yml

.baremetal-runner-santis-gh200:
  extends: .f7t-baremetal-runner
  variables:
    FIRECREST_SYSTEM: 'santis'
    # needed for uenv to see sw-stack from todi
    CLUSTER_NAME: 'todi'
    ARCH: 'aarch64'
    F7T_URL: 'https://api.cscs.ch/cw/firecrest/v1'

.setup_python:
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -r scripts/cscs_ci/requirements.txt

.setup_uenv:
  script:
    - uenv image pull icon-wcp/v1:rc4

.configure_with_uenv:
  script:
    - uenv run icon-wcp/v1:rc4 -- ./config/cscs/${CONFIG}

.check_with_uenv:
  script:
    - uenv run icon-wcp/v1:rc4 -- ./icon-dev.checksuite

.santis_create_common:
  extends: .baremetal-runner-santis-gh200 
  stage: .pre
  timeout: 1h
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - !reference [.setup_python, script]
  script:
    - ./scripts/cscs_ci/cscs_ci_from_yml --tag ${TAG} --builder ${BUILDER}
  artifacts:
    paths:
      - pipeline.yml

.trigger_common:
  trigger:
    include:
      - artifact: pipeline.yml
        job: create-pipeline
    strategy: depend
    forward:
      pipeline_variables: true

.build_common_santis:
  extends: .baremetal-runner-santis-gh200
  stage: build
  timeout: 2h
  artifacts:
    paths:
    - config.log
    - run/**/*
    - scripts/**/*
    - make_runscripts
    - bin/icon
    - externals/ecrad/data
    - externals/probtest/**/*
    - data/**/*
    when: always
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: recursive
    CSCS_REWRITE_RELATIVE_SUBMODULES: 'YES'
    # needed for to pick correct header in collect.set-up.info
    HOST: santis
    # ICON configure fails to detect host
    acx_cv_host_fqdn: santis


.build_santis_cpu_nvhpc:
  variables:
    CONFIG: santis.cpu.nvhpc
  extends: .build_common_santis
  before_script:
    - !reference [.setup_uenv, script]
  script:
    - !reference [.configure_with_uenv, script]

.build_santis_gpu_nvhpc:
  extends: .build_common_santis
  variables:
    CONFIG: santis.gpu.nvhpc
  before_script:
    - !reference [.setup_uenv, script]
  script:
    - !reference [.configure_with_uenv, script]

.run_common_santis:
  extends: .baremetal-runner-santis-gh200 
  timeout: 1h
  stage: run
  dependencies:
    - Build ICON
  before_script:
    - !reference [.setup_python, script]
  script:
    - echo use_builddir=$(pwd) >> run/set-up.info
    - cd run
    - rundir=$(pwd)
    - cd checksuite.icon-dev
    - !reference [.check_with_uenv, script]
  variables:
    GIT_STRATEGY: none
