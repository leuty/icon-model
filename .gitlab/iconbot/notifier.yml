# A configuration file for the Iconbot notifier
# See https://gitlab.dkrz.de/icon/ci-tooling/iconbot

# The server runs with ICONBOT_CONFIG_SOURCE='mr:source_branch',
# which means that the configuration file is taken from the source branch of a
# merge request.

.common-notifications: &common-notifications
  - file_names: [.gitlab/iconbot/notifier.yml]
    labels: [Iconbot]
  - file_names: [RELEASE_NOTES.md]
    labels: [Release notes]
  # CI:
  - file_names:
      - .clang-format
      - .gitlab-ci.yml
      - .gitlab/ci/*
      - .pre-commit-config.yaml
      - scripts/ci_scripts/*
      - scripts/cscs_ci/*
    labels: [CI]
    mentions: [m300488, k202125]
  # Build system:
  - file_names:
      - '*.mk.in'
      - Makefile.in
      - collect.extra-libs.in
      - configure.ac
      - dep*.config.in
      - m4/*
      - src/shared/mo_util_vcs.f90
      - utils/cmake-wrapper/*
      - utils/mkhelper/*
      - utils/pvcs.py
    labels: [Build system]
    mentions: [m300488]
  # Reference data
  - file_names:
      - run/tolerance/hashes/*
      - test/microphysics_1mom_schemes/reference/*
      - test/microphysics_1mom_schemes/tolerance/*
    labels: [new-reference]
  # Documentation:
  - file_names:
      - doc/www/*
    labels: [Documentation]
  - file_names:
      - doc/www/index.md
      - doc/www/conf.py
    mentions: [m300368]
  # GPU-related changes:
  - file_names: ['*.f90', '*.F90']
    diff_regexps: ['(?i)^\s*!\$acc']
    labels: [GPU]
  - file_names:
      - '*.cu'
      - '*.hip.cc'
      - src/shared/mo_acc_device_management.f90
    labels: [GPU]
  # Ocean:
  - file_names:
      - src/hamocc/*
      - src/ocean/*
      - src/sea_ice/*
    labels: [Ocean]
  # MVStream:
  - file_names:
      - src/io/shared/mo_name_list_output.f90
      - src/io/shared/mo_name_list_output_init.f90
      - src/shared/mo_derived_variable_handling.f90
      - src/shared/mo_statistics.f90
    labels: [MVStream]
    mentions: [k202125]
  # Granules:
  - file_names:
      - .gitlab/ci/functional/nwp-microphysics.yml
      - src/atm_phy_schemes/mo_2mom_mcrph_setup.f90
      - src/atm_phy_schemes/mo_2mom_mcrph_types.f90
      - src/atm_phy_schemes/mo_lookup_tables_constants.f90
      - src/atm_phy_schemes/mo_thdyn_functions.f90
      - src/configure_model/mo_2mom_mcrph_config.f90
      - src/granules/microphysics_1mom_schemes/**/*
      - src/shared/mo_impl_constants.f90
      - src/shared/mo_impl_constants_grf.f90
      - src/shared/mo_kind.f90
      - src/shared/mo_physical_constants.f90
      - test/microphysics_1mom_schemes/**/*
    mentions: [b382090]
  # Unit tests:
  - file_names:
      - utils/test_driver.py
      - test/unit-tests/**/*
    mentions: [k202204]
  # ComIn
  - file_names:
      - src/io/shared/mo_comin_adapter.f90
    mentions: [k202160]
    labels: [ComIn]
  # Externals:
  - file_names:
      - externals/*
    labels: [Externals]
  - file_names:
      - externals/fortran-support
    mentions: [b382190]
  - file_names:
      - externals/jsbach
      - shared/mo_util_jsbach.f90
    labels: [ICON-Land]
  - file_names:
      - externals/ecrad
    mentions: [m300368, b381110]
  # C++/Kokkos:
  - file_names:
     - ragnarok/*
     - .gitlab/ci/unit/ragnarok.yml
    labels: [C++, WarmWorld]
  # AES test references:
  - file_names:
      - run/checksuite.icon-dev/check.aes_amip_test_update
      - run/checksuite.icon-dev/check.atm_bubble_test_update
      - run/checksuite.icon-dev/check.atm_cph_nest_R2B4_test_update
      - run/checksuite.icon-dev/check.atm_qubicc_update
    mentions: [m214002]
  # Various personal notifications:
  - mentions: [k202170]
    file_names:
      - src/shr_horizontal/mo_math_divrot.f90
      - src/shr_horizontal/mo_math_gradients.f90
      - src/shr_horizontal/mo_math_laplace.f90
  - mentions: [k202204]
    file_names:
      - src/parallel_infrastructure/mo_communication*
      - src/parallel_infrastructure/mo_mpi.f90
      - src/parallel_infrastructure/mo_sync.f90
  - mentions: [k202123]
    file_names:
      - run/exp.amip*
      - run/exp.aes*
      - run/exp.atm*
      - run/*.config
  - mentions: [m300368, b381110]
    file_names:
      - src/atm_phy_nwp/*ecrad*
      - src/atm_phy_nwp/mo_nwp_rad_interface.f90
  - mentions: [m300368]
    file_names:
      - src/atm_phy_nwp/mo_nwp_aerosol.f90
  - mentions: [k202174, k202137]
    file_names:
      - src/atm_phy_aes/mo_cloud_mig/mo_aes_graupel.f90
      - src/atm_phy_aes/mo_cloud_mig/mo_cloud_mig.f90
      - src/atm_phy_aes/mo_aes_thermo.f90
      - ragnarok/*
      - .gitlab/ci/unit/ragnarok.yml

icon/icon:
  default:
    # Disable notifications for synchronization MRs:
    title_regexps: ['(?i)^(?:(?!merge.*to.*rc).)*$']
  notifications:
    - *common-notifications
    - from: [icon/icon-mpim]
      title_regexps:
      labels: [MPIM]
    - from: [icon/icon-nwp]
      title_regexps:
      labels: [NWP]
    - from: [icon/icon-dkrz]
      title_regexps:
      labels: [DKRZ]

icon/icon-mpim:
  default:
    # Disable notifications for synchronization MRs:
    title_regexps: ['(?i)^(?:(?!merge.*to.*rc).)*$']
  notifications:
    - *common-notifications
    - title_regexps: ['^Intermediate merge to RC$']
      labels: [RC-to-master]

icon/icon-nwp:
  default:
    # Disable notifications for synchronization MRs:
    title_regexps: ['(?i)^(?:(?!merge.*to.*master).)*$']
  notifications:
    - *common-notifications

icon/icon-dkrz:
  notifications:
    - *common-notifications
