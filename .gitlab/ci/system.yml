generate-checksum-table:
  stage: system
  needs:
    - aes:bubble:cpu:analyze
    - aes:bubble:cpu_sp:analyze
    - aes:bubble:gcc:analyze
    - aes:bubble:gpu:analyze
    - aes:bubble:gpu_sp:analyze
    - aes:bubble:nag:analyze
    - aes:bubble:nag_sp:analyze
    - aes:bubble:ragnarok:cpu:analyze
    - aes:bubble:ragnarok:gpu:analyze
    - aes:coupled:cpu:analyze
  extends:
    - .common:alpine
    - .system:checksum
  variables:
    ICON_CI_UTILS_APK_PACKAGES: yq-go
  script:
    - |
      # !reference [generate-checksum-table, script]
      test -z "${ICON_CI_FAILED_ANALYZE_JOB_NAME-}" || {
        icon_ci_log_error_msg \
          "ERROR: job '${ICON_CI_FAILED_ANALYZE_JOB_NAME}' failed for unknown \
      reasons (see ${ICON_CI_FAILED_ANALYZE_JOB_URL})"
        exit 1
      }
      icon_ci_log_section_start 'Generating the model output checksum table' 'collapsed=false'
      (
        set -u
        test -e "${ICON_CI_CHECKSUM_TABLE_PATH}" || (
          dir=$(dirname "${ICON_CI_CHECKSUM_TABLE_PATH}")
          set -x
          mkdir -p "${dir}"
          touch "${ICON_CI_CHECKSUM_TABLE_PATH}"
        )

        set -x
        yq --inplace eval-all \
          '. as $item ireduce ({}; . * $item ) | sort_keys(..)' \
          "${ICON_CI_CHECKSUM_TABLE_PATH}" \
          "${ICON_CI_CHECKSUM_TMP_PATH}"/*
      ) 2>&1
      icon_ci_log_section_end
  when: on_failure
  artifacts:
    paths:
      - ${ICON_CI_CHECKSUM_TABLE_PATH}
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - !reference [.system:analyze, rules]

Accept new checksum table:
  stage: system
  needs: [generate-checksum-table]
  extends:
    - .common:alpine
    - .system:checksum
  variables:
    ICON_CI_UTILS_APK_PACKAGES: git
  script:
    - |
      # !references [Accept new checksum table, script]
      (
        set -u

        branch=${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-}}
        test -n "${branch}" || {
          icon_ci_log_error_msg "ERROR: '${CI_JOB_NAME}' can only run for \
      merge request and branch pipelines, i.e. when either the \
      CI_MERGE_REQUEST_SOURCE_BRANCH_NAME or the CI_COMMIT_BRANCH variable is \
      set"
          exit 1
        }

        test "${CI_PROJECT_ID}" = "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-${CI_PROJECT_ID}}" || {
          icon_ci_log_error_msg "ERROR: '${CI_JOB_NAME}' does not support \
      pipelines from fork projects"
          exit 1
        }

        icon_ci_log_section_start "Pushing changes to '${branch}'" 'collapsed=false'
        (
          set -x
          git add --force -- "${ICON_CI_CHECKSUM_TABLE_PATH}"
          git \
            -c user.name="${GITLAB_USER_NAME}" \
            -c user.email="${GITLAB_USER_EMAIL}" \
            commit \
              --no-verify --no-post-rewrite --quiet \
              --message "update ${ICON_CI_CHECKSUM_TABLE_PATH##*/}

      ${CI_JOB_URL}"
          git push \
            --no-recurse-submodules --no-verify --quiet \
            origin "HEAD:refs/heads/${branch}"
        ) 2>&1
        icon_ci_log_section_end
      )
  when: manual
  interruptible: false
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == null && $CI_COMMIT_BRANCH == null
      when: never
    # For a better integration with the Buildbot, all ICON forks are configured
    # with ci_allow_fork_pipelines_to_run_in_parent_project=false, which also
    # means that the repository clone created for this job is always the one we
    # want to push the changes to. Hence, the following condition is expected to
    # be always false, but we keep it as an additional protection level:
    - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_ID && $CI_PROJECT_ID != $CI_MERGE_REQUEST_SOURCE_PROJECT_ID
      when: never
    - !reference [generate-checksum-table, rules]
  manual_confirmation: >-
    This job will create a new commit on the branch. Make sure to pull it before adding any further commits.
