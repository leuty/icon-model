    - .io:rbf_write
    - .aes:bubble
  artifacts:
    paths:
      - ${ICON_CI_UTILS_ICON_MKEXP_WORK_REL_PATH}/${ICON_CI_UTILS_ICON_MKEXP_RUN_SUBDIR}/${ICON_CI_UTILS_ICON_MKEXP_EXP_ID}*.nc
      - ${ICON_CI_UTILS_ICON_MKEXP_WORK_REL_PATH}/${ICON_CI_UTILS_ICON_MKEXP_RUN_SUBDIR}/rbf_coeffs_dom01.nc
  needs: [aes:bubble:gcc:build]

aes:bubble:gcc:analyze:
  extends: .system:analyze
  needs: [aes:bubble:gcc:run]

aes:bubble:cpu:build:
  extends:
