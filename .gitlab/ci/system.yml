include:
  - local: .gitlab/ci/utils/git.yml
  - local: .gitlab/ci/utils/icon.yml
  - local: .gitlab/ci/common/dkrz.yml
  - local: .gitlab/ci/common/any-image.yml
  - local: .gitlab/ci/common/alpine.yml

.system:build:levante:
  extends:
    - .common:dkrz:levante
    - .utils:icon:build
  stage: system
  needs: []
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 32
    ICON_CI_COMMON_DKRZ_SLURM_TIMELIMIT: "20:00"
    ICON_CI_UTILS_GIT_CLONE_PATH: ${ICON_CI_COMMON_DKRZ_SHMEM_PATH}/icon
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: >-
      /configure /utils/ /*.in /run/*.in /src/ /support/ /ragnarok/ /config/
    ICON_CI_UTILS_ICON_SOURCE_PATH: ${ICON_CI_UTILS_GIT_CLONE_PATH}
    ICON_CI_UTILS_ICON_BUILD_JOB_COUNT: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
  before_script:
    - !reference [.common:dkrz:levante, before_script]
    - !reference [.utils:icon:build, before_script]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - !reference [.common:dkrz:levante, rules]
    - if: >-
        $CI_PIPELINE_SOURCE == "schedule" &&
          $ICON_CI_TEST_SCHEDULE == "weekly"
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
          $CI_MERGE_REQUEST_PROJECT_PATH == "icon/icon-mpim" &&
          $CI_MERGE_REQUEST_DRAFT == "false"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

.system:run:levante:
  extends:
    - .common:dkrz:levante
    - .utils:icon:run
  stage: system
  needs: []
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: compute
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 256
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: >-
      /utils/ /run/mkexp/ /${ICON_CI_UTILS_ICON_MKEXP_CONFIG_REL_PATH}
      /run/dict.iconam.mpim /run/add_run_routines /data
    ICON_CI_UTILS_ICON_MKEXP_ACCOUNT: ${ICON_CI_COMMON_DKRZ_SLURM_ACCOUNT}
  before_script:
    - !reference [.common:dkrz:levante, before_script]
    - module load python3
    - !reference [.utils:icon:run, before_script]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - !reference [.common:dkrz:levante, rules]
    - if: >-
        $CI_PIPELINE_SOURCE == "schedule" &&
          $ICON_CI_TEST_SCHEDULE == "weekly"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.io:rbf_write:
  variables:
    ICON_CI_UTILS_ICON_MKEXP_EXTRA_ARGS: >-
      namelists.NAMELIST_atm.interpol_nml.lrbf_write=.TRUE.
      namelists.NAMELIST_atm.interpol_nml.lrbf_read=.FALSE.
  artifacts:
    paths:
      - ${ICON_CI_UTILS_ICON_MKEXP_WORK_REL_PATH}/${ICON_CI_UTILS_ICON_MKEXP_RUN_SUBDIR}/rbf_coeffs_dom01.nc

.io:rbf_read:
  variables:
    ICON_CI_UTILS_ICON_MKEXP_EXTRA_ARGS: >-
      files.rbf_io.rbf_coeffs_dom01..nc=${ICON_CI_UTILS_ICON_OUTPUT_PATH}/rbf_coeffs_dom01.nc
      namelists.NAMELIST_atm.interpol_nml.lrbf_write=.FALSE.
      namelists.NAMELIST_atm.interpol_nml.lrbf_read=.TRUE.

.system:checksum:
  extends: .utils:git:ignore
  variables:
    ICON_CI_CHECKSUM_TABLE_PATH: >-
      ${CI_PROJECT_DIR}/.gitlab/ci/data/system-checksum-table.yml
    ICON_CI_CHECKSUM_TMP_PATH: >-
      ${ICON_CI_UTILS_GIT_IGNORE_PATH}/system-checksums

.system:analyze:
  stage: system
  extends:
    - .common:any-image
    - .system:checksum
  image: registry.gitlab.dkrz.de/icon/containers/icon-ci-analyze:f6633645
  before_script:
    - |
      # !reference [.system:analyze, before_script]
      {
        # If this job fails for any unexpected reason, the dependent job will
        # have the required information to report the error:
        echo "ICON_CI_FAILED_ANALYZE_JOB_NAME=${CI_JOB_NAME}"
        echo "ICON_CI_FAILED_ANALYZE_JOB_URL=${CI_JOB_URL}"
      } >"${CI_PROJECT_DIR}/dependent.env"
    - !reference [.common:any-image, before_script]
  script:
    - |
      # !reference [.system:analyze, script]
      icon_ci_log_section_start 'Verifying checksums of the model output' 'collapsed=false'
      (
        set -u
        model_output_files=$(find "${ICON_CI_UTILS_ICON_OUTPUT_PATH}" -type f -name "${ICON_CI_UTILS_ICON_OUTPUT_FILENAME_PREFIX}*.nc" | sort)
        cdo --version
        set -x
        calculated_cksum=$( for ofile in ${model_output_files}; do tag=$(md5sum ${ofile} | cut -d ' ' -f1); cdo splitgrid ${ofile} ${tag}_ ; for splitted_output in ${tag}_*; do cdo -outputf,'%.17g' ${splitted_output}; done; done | sha256sum --text - | cut -d ' ' -f1)
        expected_cksum=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1], "r"))[sys.argv[2]])' "${ICON_CI_CHECKSUM_TABLE_PATH}" "${ICON_CI_UTILS_ICON_OUTPUT_ID}") || expected_cksum=unknown
        mkdir -p "${ICON_CI_CHECKSUM_TMP_PATH}"
        python3 -c 'import os, sys, yaml; yaml.safe_dump({sys.argv[2]: sys.argv[3]}, open(sys.argv[1], "w"))' "${ICON_CI_CHECKSUM_TMP_PATH}/${CI_JOB_NAME_SLUG}.yml" "${ICON_CI_UTILS_ICON_OUTPUT_ID}" "${calculated_cksum}"
        # We assume that the only reason for the job to fail after this line is
        # the checksum mismatch, which is an "expected failure" handled by the
        # dependent jobs. We also want to disable the shell trace with no extra
        # messages in the log:
        { set +x; } >"${CI_PROJECT_DIR}/dependent.env" 2>/dev/null
        test "${calculated_cksum}" = "${expected_cksum}" && {
          icon_ci_log_info_msg "The calculated output checksum for \
      '${ICON_CI_UTILS_ICON_OUTPUT_ID}' matches the expected value '${expected_cksum}'"
        } || {
          icon_ci_log_error_msg "ERROR: the expected output checksum for \
      '${ICON_CI_UTILS_ICON_OUTPUT_ID}' is '${expected_cksum}', \
      got '${calculated_cksum}'"
          exit 1
        }
      ) 2>&1
      icon_ci_log_section_end
  artifacts:
    paths:
      - ${ICON_CI_CHECKSUM_TMP_PATH}/*
    reports:
      dotenv: dependent.env
    when: on_failure
    expire_in: 1 day
  rules: !reference [.system:run:levante, rules]

.aes:bubble:
  variables:
    ICON_CI_UTILS_ICON_CONFIG_EXTRA_ARGS: --enable-atmo --enable-aes --enable-rte-rrtmgp
    ICON_CI_UTILS_ICON_BUILD_EXTRA_SUBMODULE_PATHS: externals/memman externals/rte-rrtmgp
    ICON_CI_UTILS_ICON_MKEXP_CONFIG_REL_PATH: run/examples/bubble.config
    ICON_CI_UTILS_ICON_MKEXP_EXTRA_ARGS: >-
      jobs.run.cpus_per_node=128
      jobs.run.use_cpu_mask=false

aes:bubble:gcc:build:
  extends:
    - .system:build:levante
    - .aes:bubble
  variables:
    ICON_CI_UTILS_ICON_CONFIG_REL_PATH: config/dkrz/levante.gcc

aes:bubble:gcc:run:
  extends:
