include:
  - local: .gitlab/ci/common/dkrz.yml
  # Generate builder rules and warning jobs:
  - local: .gitlab/ci/utils/builder-rules.yml
    inputs: {builder: levante_gcc}
  - local: .gitlab/ci/utils/builder-rules.yml
    inputs: {builder: levante_gpu_nvhpc}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "parent_pipeline"
      when: never
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "merge_request_event"
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none

default:
  interruptible: true

.ragnarok:
  extends: .common:dkrz:jacamar
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 64
    GIT_SUBMODULE_PATHS: externals/kokkos
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: /ragnarok/
    CLICOLOR_FORCE: 1
    VERBOSE: # any given value is ignored, it's just checked for existence
    CMAKE_BUILD_PARALLEL_LEVEL: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
    MAKEFLAGS: --no-print-directory --output-sync=target
    CTEST_PARALLEL_LEVEL: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
  script:
    - |
      icon_ci_log_section_start 'Configuring Ragnarok' 'collapsed=false'
      ICON_CI_RAGNAROK_BUILD_PATH=${ICON_CI_RAGNAROK_BUILD_PATH:-"${CI_PROJECT_DIR}/build"}
      (
        cmake --version
        set -ux
        cmake \
          -B "${ICON_CI_RAGNAROK_BUILD_PATH}" \
          -S "${CI_PROJECT_DIR}/ragnarok" \
          -C "${ICON_CI_RAGNAROK_CACHE_FILE_PATH}" \
          -G 'Unix Makefiles'
      ) 2>&1
      icon_ci_log_section_end
      icon_ci_log_section_start 'Building Ragnarok' 'collapsed=false'
      (
        set -ux
        cmake --build "${ICON_CI_RAGNAROK_BUILD_PATH}"
      ) 2>&1
      icon_ci_log_section_end
      icon_ci_log_section_start 'Testing Ragnarok' 'collapsed=false'
      (
        set -ux
        ctest --test-dir "${ICON_CI_RAGNAROK_BUILD_PATH}" --verbose
      ) 2>&1
      icon_ci_log_section_end

ragnarok:cpu:
  extends:
    - .ragnarok
    - .utils:builder-rules:web-manual:levante_gcc
  variables:
    OMP_PROC_BIND: close
    OMP_PLACES: cores
    OMP_NUM_THREADS: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
    ICON_CI_RAGNAROK_CACHE_FILE_PATH: >-
      ${CI_PROJECT_DIR}/ragnarok/cmake/caches/levante_cpu.cmake

ragnarok:gpu:
  extends:
    - .ragnarok
    - .utils:builder-rules:web-manual:levante_gpu_nvhpc
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: gpu
    ICON_CI_COMMON_DKRZ_SLURM_GPUS_PER_NODE: 1
    ICON_CI_RAGNAROK_CACHE_FILE_PATH: >-
      ${CI_PROJECT_DIR}/ragnarok/cmake/caches/levante_gpu.cmake
