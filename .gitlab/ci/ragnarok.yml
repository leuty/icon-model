include:
  - local: .gitlab/ci/common/dkrz.yml
  # Generate builder rules and warning jobs:
  - local: .gitlab/ci/utils/builder-rules.yml
    inputs: {builder: levante_gcc}
  - local: .gitlab/ci/utils/builder-rules.yml
    inputs: {builder: levante_gpu_nvhpc}

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "parent_pipeline"
      when: never
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "merge_request_event"
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none

default:
  interruptible: true

.common:
  extends: .common:dkrz:jacamar
  variables:
    # git
    GIT_SUBMODULE_PATHS: externals/kokkos
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: /ragnarok/
    # slurm
    ICON_CI_COMMON_DKRZ_SLURM_EXTRA_PARAMETERS: --mem=16000
    # cmake
    CTEST_PARALLEL_LEVEL: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
    CMAKE_BUILD_PARALLEL_LEVEL: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
    VERBOSE:
    CTEST_OUTPUT_ON_FAILURE:
    ctestOptions: --extra-verbose

levante-cpu:
  extends:
    - .common
    - .utils:builder-rules:web-manual:levante_gcc
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: shared,compute
    OMP_PROC_BIND: close
    OMP_PLACES: cores
    OMP_NUM_THREADS: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
  script:
    - >
      cmake -B . -S ${CI_PROJECT_DIR}/ragnarok
      -C ragnarok/cmake/caches/levante_cpu.cmake
    - cmake --build .
    - ctest $ctestOptions

levante-gpu:
  extends:
    - .common
    - .utils:builder-rules:web-manual:levante_gpu_nvhpc
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: gpu-devel,gpu
    ICON_CI_COMMON_DKRZ_SLURM_GPUS_PER_NODE: 1
  script:
    - >
      cmake -B . -S ${CI_PROJECT_DIR}/ragnarok
      -C ragnarok/cmake/caches/levante_gpu.cmake
    - cmake --build .
    - ctest
