include:
  - local: .gitlab/ci/utils/log.yml

# Implements a template for a warning job: the job is allowed to fail and always
# does, which is supposed to alert the developers. At the same time, the
# pipeline does not fail.
#
# The job can optionally emit an error message to the log. The text of the
# message can be set via the ICON_CI_COMMON_WARNING_MESSAGE variable (defaults
# to an empty string, which means that no message is emitted).
#
.common:warning:
  extends: .utils:log
  variables:
    # Internal variables:
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - |
      # !reference [.common:warning, script]
      test -z "${ICON_CI_COMMON_WARNING_MESSAGE-}" || {
        icon_ci_log_error_msg "${ICON_CI_COMMON_WARNING_MESSAGE}"
      }
      exit 1
  tags:
    - alpine
