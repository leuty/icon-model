include:
  - local: .gitlab/ci/utils/log.yml
  - local: .gitlab/ci/utils/git.yml

# Implements the recommended default template for a job based on the alpine
# Docker image. Installs the required Alpine Package Keeper (APK) packages using
# the GitLab CI caching.
#
# The installation of the packages can be controlled with the following
# variables:
#   - ICON_CI_COMMON_ALPINE_PACKAGES (defaults to an empty string): a
#     space-separated list of packages to install with APK;
#   - ICON_CI_COMMON_ALPINE_CACHE_PATH (defaults to
#     `$ICON_CI_UTILS_GIT_IGNORE_PATH/alpine`, see .common:git:ignore): path
#     inside $CI_PROJECT_DIR to the APK cache directory (the caching is disabled
#     if the variable is set to an empty string).
#
.common:alpine:
  extends:
    - .utils:log
    - .utils:git:ignore
  variables:
    ICON_CI_COMMON_ALPINE_CACHE_PATH: ${ICON_CI_UTILS_GIT_IGNORE_PATH}/alpine
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs=4
  before_script:
    - !reference [.utils:log, before_script]
    - |
      # !reference [.common:alpine, before_script]
      icon_ci_log_section_start 'Installing APK packages'
      (
        set -u

        test -z "${ICON_CI_COMMON_ALPINE_PACKAGES-}" && {
          icon_ci_log_info_msg \
            'ICON_CI_COMMON_ALPINE_PACKAGES is empty: nothing to install'
          # Drop the cache if the list of required packages is empty:
          test -z "${ICON_CI_COMMON_ALPINE_CACHE_PATH-}" || (
            set -x
            rm -rf "${ICON_CI_COMMON_ALPINE_CACHE_PATH}"
          )
        } || {

          apk --version

          test -z "${ICON_CI_COMMON_ALPINE_CACHE_PATH-}" && {
            icon_ci_log_info_msg \
              'ICON_CI_COMMON_ALPINE_CACHE_PATH is empty: the caching is disabled'
          } || {
            cache_path="${ICON_CI_COMMON_ALPINE_CACHE_PATH}/apk"

            # Enable the cache:
            ( set -x; ln -s "${cache_path}" /etc/apk/cache; )

            # Invalidate the cache if the list of required packages has changed:
            cache_key=${ICON_CI_COMMON_ALPINE_PACKAGES}
            cache_key_path="${ICON_CI_COMMON_ALPINE_CACHE_PATH}/apk-cache-key"

            echo "${cache_key}" | diff - "${cache_key_path}" >/dev/null 2>&1 && (
              icon_ci_log_info_msg "Using cache from '${cache_path}'..."
              set -x
              # Clean up the cache to prevent the accumulation of outdated
              # packages:
              apk cache clean
            ) || (
              icon_ci_log_info_msg "Initializing cache in '${cache_path}'..."
              set -x
              # Fully reset the cache:
              rm -rf "${cache_path}"
              mkdir -p "${cache_path}"
              echo "${cache_key}" > "${cache_key_path}"
            )
          }

          set -x
          # Install the required packages:
          apk add ${ICON_CI_COMMON_ALPINE_PACKAGES}
        }
      ) 2>&1
      icon_ci_log_section_end
  tags:
    - alpine
  cache:
    - key: alpine-${CI_JOB_NAME_SLUG}
      paths:
        - ${ICON_CI_COMMON_ALPINE_CACHE_PATH}
