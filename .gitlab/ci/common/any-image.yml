include:
  - local: .gitlab/ci/utils/log.yml

# Implements the recommended default template for a job based on a Docker image.
#
.common:any-image:
  extends: .utils:log
  variables:
    # Internal variables:
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs=4
  tags:
    - docker-any-image
  image: debian:stable-slim
