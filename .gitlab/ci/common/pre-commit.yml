include:
  - local: .gitlab/ci/common/ubuntu.yml

# Implements the common template for jobs that require the pre-commit package.
# Enables the pre-commit command in the environment and installs all hooks
# listed in .pre-commit-config.yaml.
#
.common:pre-commit:
  extends: .common:ubuntu
  variables:
    ICON_CI_UTILS_APT_PACKAGES: git pre-commit python3-minimal
    ICON_CI_COMMON_PRE_COMMIT_CACHE_PATH: ${ICON_CI_UTILS_GIT_IGNORE_PATH}/pre-commit
    PRE_COMMIT_HOME: ${ICON_CI_COMMON_PRE_COMMIT_CACHE_PATH}/cache
    PRE_COMMIT_COLOR: always
  before_script:
    - !reference [.common:ubuntu, before_script]
    - |
      # !reference [.common:pre-commit, before_script]
      icon_ci_log_section_start 'Installing pre-commit hooks'
      (
        set -u

        python3 --version
        pre-commit --version

        cache_path=${PRE_COMMIT_HOME}

        # Invalidate the cache if the versions of Python and pre-commit have
        # changed:
        cache_key="$(python3 -c 'import sys; print("python", sys.version)')
        $(pre-commit --version)"
        cache_key_path="${ICON_CI_COMMON_PRE_COMMIT_CACHE_PATH}/key"

        echo "${cache_key}" | diff - "${cache_key_path}" >/dev/null 2>&1 && {
          icon_ci_log_info_msg "Using cache from '${cache_path}'..."
        } || (
          icon_ci_log_info_msg "Initializing cache in '${cache_path}'..."
          set -x
          # Fully reset the cache:
          rm -rf "${cache_path}"
          mkdir -p "${cache_path}"
          echo "${cache_key}" > "${cache_key_path}"
        )

        set -x
        # Install pre-commit hooks:
        pre-commit install-hooks
      ) 2>&1
      icon_ci_log_section_end
  cache:
    - key: ubuntu-pre-commit
      paths:
        - ${ICON_CI_UTILS_APT_CACHE_PATH}
    - key:
        prefix: pre-commit-hooks
        files:
          - .pre-commit-config.yaml
      paths:
        - ${ICON_CI_COMMON_PRE_COMMIT_CACHE_PATH}
