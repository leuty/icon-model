include:
  - local: .gitlab/ci/utils/log.yml
  - local: .gitlab/ci/utils/apt.yml

# Implements the recommended default template for a job based on the ubuntu
# Docker image. Installs the required Advanced Package Tool (APT) packages (see
# .utils:apt).
#
.common:ubuntu:
  extends:
    - .utils:log
    - .utils:apt
  variables:
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs=4
  before_script:
    - !reference [.utils:log, before_script]
    - !reference [.utils:apt, before_script]
  tags:
    - docker-any-image
  image:
    name: ubuntu:latest
