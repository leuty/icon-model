include:
  - project: anw_dienste/ci-templates
    file: .slurm-ci.yml
  - local: .gitlab/ci/utils/log.yml
  - local: .gitlab/ci/utils/git.yml
  - local: .gitlab/ci/common/warning.yml

# Implements the recommended default template for a job run by the Jacamar
# GitLab runner on Levante at DKRZ. Sets reasonable default parameters for the
# scheduler (SLURM) and git, as well as runs basic environment sanitation.
#
.common:dkrz:levante:
  extends:
    - .default
    - .utils:log
    - .utils:git:clone_any_path
    - .utils:git:fast_and_small
  variables:
    # SLURM account to charge resources to (--account):
    ICON_CI_COMMON_DKRZ_SLURM_ACCOUNT: ka1125

    # Comma-separated list of SLURM partitions for the resource allocation
    # (--partition):
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: shared,compute

    # Number of nodes to allocate for the job (--nodes):
    ICON_CI_COMMON_DKRZ_SLURM_NNODES: 1

    # Number of tasks the job runs (--ntasks):
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 8

    # Number of GPUs required for the job on each node (--gpus-per-node):
    ICON_CI_COMMON_DKRZ_SLURM_GPUS_PER_NODE: 0

    # Limit on the total run time of the job allocation (--time):
    ICON_CI_COMMON_DKRZ_SLURM_TIMELIMIT: "05:00"

    # Space-separated list of extra SBATCH parameters:
    ICON_CI_COMMON_DKRZ_SLURM_EXTRA_PARAMETERS: null

    # Non-existent unique path in the in-memory filesystem partition:
    #   Hint: it is possible to clone the repository in the directory on the
    #   fast in-memory partition by setting the ICON_CI_UTILS_GIT_CLONE_PATH
    #   variable to the value of ICON_CI_COMMON_DKRZ_SHMEM_PATH, i.e.
    #     variables:
    #       ICON_CI_UTILS_GIT_CLONE_PATH: ${ICON_CI_COMMON_DKRZ_SHMEM_PATH}
    ICON_CI_COMMON_DKRZ_SHMEM_PATH: /dev/shm/icon-${CI_JOB_NAME_SLUG}-${CI_JOB_ID}

    # Internal variables:
    GIT_SUBMODULE_STRATEGY: normal
    SCHEDULER_PARAMETERS: >-
      --account=${ICON_CI_COMMON_DKRZ_SLURM_ACCOUNT}
      --partition=${ICON_CI_COMMON_DKRZ_SLURM_PARTITION}
      --nodes=${ICON_CI_COMMON_DKRZ_SLURM_NNODES}
      --ntasks=${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
      --gpus-per-node=${ICON_CI_COMMON_DKRZ_SLURM_GPUS_PER_NODE}
      --time=${ICON_CI_COMMON_DKRZ_SLURM_TIMELIMIT}
      ${ICON_CI_COMMON_DKRZ_SLURM_EXTRA_PARAMETERS}
  before_script:
    - !reference [.utils:log, before_script]
    - |
      # !reference [.common:dkrz:levante, before_script]
      icon_ci_log_info_msg "Running on SLURM partition '${SLURM_JOB_PARTITION:-unknown}'"
    - module purge
    - module load git
    - !reference [.utils:git:clone_any_path, before_script]
  rules:
    # By default, never enable the job if one of the following builders is
    # deactivated:
    - if: >-
        $ICON_INACTIVE_BUILDERS =~ "/(^|,)levante_gcc(,|$)/" ||
          $ICON_INACTIVE_BUILDERS =~ "/(^|,)levante_gpu_nvhpc(,|$)/" ||
          $ICON_INACTIVE_BUILDERS =~ "/(^|,)levante_intel(,|$)/" ||
          $ICON_INACTIVE_BUILDERS =~ "/(^|,)levante_nag(,|$)/"
      when: never

# A warning job created in the system stage of a merge request pipeline that
# runs if Levante is down. The job is allowed to fail and always does, which is
# supposed to bring the developer's attention to the fact that some jobs in the
# pipeline are disabled. At the same time, the pipeline does not fail.
#
Levante is down:
  extends: .common:warning
  stage: system
  needs: []
  variables:
    # Internal variables:
    ICON_CI_COMMON_WARNING_MESSAGE: >-
      Levante is considered down when any of the following builders are deactivated:
      levante_gcc, levante_gpu_nvhpc, levante_intel, levante_nag
      (see https://icon.gitlab-pages.dkrz.de/ci-tooling/icon-builders-status)
  rules:
    # Currently, we assume that if any of the following builders is inactive,
    # Levante is down:
    - if: >-
        $ICON_INACTIVE_BUILDERS !~ "/(^|,)levante_gcc(,|$)/" &&
          $ICON_INACTIVE_BUILDERS !~ "/(^|,)levante_gpu_nvhpc(,|$)/" &&
          $ICON_INACTIVE_BUILDERS !~ "/(^|,)levante_intel(,|$)/" &&
          $ICON_INACTIVE_BUILDERS !~ "/(^|,)levante_nag(,|$)/"
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" && (
          $CI_MERGE_REQUEST_PROJECT_PATH == "icon/icon-mpim" ||
            $CI_MERGE_REQUEST_PROJECT_PATH == "icon/icon"
        )
      allow_failure: false
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ICON_CI_TEST_SCHEDULE == "weekly"
