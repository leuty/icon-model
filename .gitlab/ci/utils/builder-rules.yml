# Generates common sets of rules for downstream pipelines based on the inputs
# (see https://docs.gitlab.com/ci/inputs).

spec:
  inputs:
    builder:
      description: name of the builder to generate the rules for
    warning-stage:
      default: test
      description: pipeline stage to put the warning job on
---

include:
  - local: .gitlab/ci/utils/log.yml

# Defines a set of rules that enable the job in the web pipelines as a manual
# one, regardless of whether the respective builder is active, as well as in the
# merge request pipelines, but only if the respective builder is active.
#
".utils:builder-rules:web-manual:$[[ inputs.builder ]]":
  rules:
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "web"
      when: manual
    - if: $ICON_INACTIVE_BUILDERS =~ "/(^|,)$[[ inputs.builder ]](,|$)/"
      when: never
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "merge_request_event"

# Defines a set of rules that enable the job in the web pipelines, regardless of
# whether the respective builder is active, as well as in the merge request
# pipelines, but only if the respective builder is active.
#
".utils:builder-rules:web-default:$[[ inputs.builder ]]":
  rules:
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "web"
    - if: $ICON_INACTIVE_BUILDERS =~ "/(^|,)$[[ inputs.builder ]](,|$)/"
      when: never
    - if: $ICON_CI_PARENT_PIPELINE_SOURCE == "merge_request_event"

# A warning job created in the pipeline that runs if the respective builder is
# inactive. The job is allowed to fail and always does, which is supposed to
# bring the developer's attention to the fact that some jobs in the pipeline are
# disabled. At the same time, the pipeline does not fail.
#
"Builder '$[[ inputs.builder ]]' is inactive":
  extends: .utils:log
  stage: "$[[ inputs.warning-stage ]]"
  needs: []
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  script:
    - |
      #
      icon_ci_log_error_msg \
        "${CI_JOB_NAME}, see https://icon.gitlab-pages.dkrz.de/ci-tooling/icon-builders-status"
      exit 1
  tags:
    - alpine
  rules:
    - if: $ICON_INACTIVE_BUILDERS =~ "/(^|,)$[[ inputs.builder ]](,|$)/"
