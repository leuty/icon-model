include:
  - local: .gitlab/ci/utils/git.yml

# Implements a before_script that installs the required PIP packages using the
# GitLab CI caching.
#
# Jobs that extend the template must ensure that their runtime environments
# provide the Python3 interpreter with the PIP module.
#
# The installation of the packages can be controlled with the following
# variables:
#   - PIP_REQUIREMENT (standard PIP environment variable, defaults to an empty
#     string): a space-separated list of paths to PIP requirement files;
#   - ICON_CI_UTILS_PIP_UPGRADE (defaults to `false`): a boolean that controls
#     whether the PIP module is upgraded before the installation of other
#     packages;
#   - ICON_CI_UTILS_PIP_PACKAGES (defaults to an empty string): a
#     space-separated list of packages to intall with PIP;
#   - ICON_CI_UTILS_PIP_CACHE_PATH (defaults to
#     `$ICON_CI_UTILS_GIT_IGNORE_PATH/pip`, see .utils:git:ignore): path
#     inside $CI_PROJECT_DIR to the PIP cache directory.
#
.utils:pip:
  extends: .utils:git:ignore
  variables:
    ICON_CI_UTILS_PIP_CACHE_PATH: ${ICON_CI_UTILS_GIT_IGNORE_PATH}/pip
  before_script:
    - |
      # !reference [.utils:pip, before_script]
      icon_ci_log_section_start 'Installing PIP packages'
      (
        set -u

        test -z "${ICON_CI_UTILS_PIP_PACKAGES-}${PIP_REQUIREMENT-}" && {
          icon_ci_log_info_msg \
            'PIP_REQUIREMENT and ICON_CI_UTILS_PIP_PACKAGES are empty: nothing to install'
          # Drop the cache if the list of required packages is empty:
          test -z "${ICON_CI_UTILS_PIP_CACHE_PATH-}" || (
            set -x
            rm -rf "${ICON_CI_UTILS_PIP_CACHE_PATH}"
          )
        } || {

          python3 --version

          # Upgrade the PIP module if required:
          test false = "${ICON_CI_UTILS_PIP_UPGRADE-false}" || (
            set -x
            PIP_REQUIREMENT= python3 -m pip --no-cache-dir install \
              --break-system-packages --root-user-action=ignore \
              --upgrade pip
          )

          python3 -m pip --version

          test -z "${ICON_CI_UTILS_PIP_CACHE_PATH-}" && {
            icon_ci_log_info_msg \
              'ICON_CI_UTILS_PIP_CACHE_PATH is empty: the caching is disabled'
            set dummy --no-cache-dir; shift
          } || {
            cache_path="${ICON_CI_UTILS_PIP_CACHE_PATH}/pip-cache"
            set dummy --cache-dir "${cache_path}"; shift

            # Invalidate the cache if the version of PIP (contains the version
            # of Python) or the list of required packages has changed:
            cache_key="$(python3 -m pip --version)
      ${ICON_CI_UTILS_PIP_PACKAGES-}
      $(for r in ${PIP_REQUIREMENT-}; do
          cat "${r}" 2>/dev/null || continue
        done)"
            cache_key_path="${ICON_CI_UTILS_PIP_CACHE_PATH}/pip-cache-key"

            echo "${cache_key}" | diff - "${cache_key_path}" >/dev/null 2>&1 && (
              icon_ci_log_info_msg "Using cache from '${cache_path}'..."
              set -x
              python3 -m pip "$@" cache info
            ) || (
              icon_ci_log_info_msg "Initializing cache in '${cache_path}'..."
              set -x
              # Fully reset the cache:
              rm -rf "${cache_path}"
              mkdir -p "${cache_path}"
              echo "${cache_key}" > "${cache_key_path}"
            )
          }

          set -x
          # Install the required packages:
          python3 -m pip "$@" install \
            --break-system-packages --root-user-action=ignore \
            ${ICON_CI_UTILS_PIP_PACKAGES-}
        }
      ) 2>&1
      icon_ci_log_section_end
  cache:
    - key: pip-${CI_RUNNER_TAGS}-${CI_JOB_NAME_SLUG}
      paths:
        - ${ICON_CI_UTILS_PIP_CACHE_PATH}
