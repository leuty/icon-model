# Sets environment variable ICON_CI_UTILS_GIT_IGNORE_PATH that points to a
# directory ignored by git.
#
# Useful for jobs that generate artifacts or caches, but are sensitive to
# untracked files in the repository clone.
#
.utils:git:ignore:
  variables:
    ICON_CI_UTILS_GIT_IGNORE_PATH: ${CI_PROJECT_DIR}/.ci_dir
