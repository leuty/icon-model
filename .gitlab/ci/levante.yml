workflow:
  name: ${BUILDER_NAME}
  rules:
    - if: $CI_PIPELINE_SOURCE != "parent_pipeline"
      when: never
    - if: $BUILDER_NAME == "levante_gcc"
      variables:
        EXTRA_SCHEDULER_PARAMETERS: ${CPU_SCHEDULER_PARAMETERS}
        CONFIG_WRAPPER: levante.gcc
        CONFIG_ARGS: >-
          --disable-art
          --disable-comin
          --disable-coupling
          --disable-ecrad
          --disable-jsbach
          --disable-les
          --disable-nwp
          --disable-ocean
          --disable-quincy
          --disable-rte-rrtmgp
          --disable-upatmo
          --disable-yaxt
          --enable-bundled-python=mtime
        BUILD_SUBMODULES: >-
          externals/cdi
          externals/fortran-support
          externals/iconmath
          externals/mtime
    - if: $BUILDER_NAME == "levante_gpu_nvhpc"
      variables:
        EXTRA_SCHEDULER_PARAMETERS: ${GPU_SCHEDULER_PARAMETERS}
        CONFIG_WRAPPER: levante.gpu.nvhpc
        CONFIG_ARGS: >-
          --disable-coupling
          --disable-jsbach
          --disable-nwp
          --disable-ocean
          --disable-quincy
          --disable-rte-rrtmgp
          --disable-upatmo
          --enable-bundled-python=mtime
          --enable-les
        BUILD_SUBMODULES: >-
          externals/cdi
          externals/fortran-support
          externals/iconmath
          externals/mtime
    - if: $BUILDER_NAME == "levante_intel_hybrid"
      variables:
        EXTRA_SCHEDULER_PARAMETERS: ${CPU_SCHEDULER_PARAMETERS}
        CONFIG_WRAPPER: levante.intel
        CONFIG_ARGS: >-
          --disable-art
          --disable-comin
          --disable-coupling
          --disable-ecrad
          --disable-jsbach
          --disable-les
          --disable-nwp
          --disable-ocean
          --disable-quincy
          --disable-rte-rrtmgp
          --disable-upatmo
          --disable-waves
          --disable-yaxt
          --enable-bundled-python=mtime
          --enable-openmp
          --enable-separate-mods
        BUILD_SUBMODULES: >-
          externals/cdi
          externals/fortran-support
          externals/iconmath
          externals/mtime

include:
  - project: "anw_dienste/ci-templates"
    file: ".slurm-ci.yml"

.common:
  extends: .default
  variables:
    SCHEDULER_PARAMETERS: >-
      --account=ka1125
      ${EXTRA_SCHEDULER_PARAMETERS}
    GIT_STRATEGY: empty
    SPARSE_PATTERNS:
    SUBMODULES:
  before_script:
    - module purge
    - module load git
    - git init --quiet .
    - git sparse-checkout set --no-cone -- ${SPARSE_PATTERNS}
    - git remote add origin "${CI_REPOSITORY_URL}"
    - git fetch --filter=blob:none --depth=1 --jobs=4 origin "${CI_COMMIT_SHA}"
    - git checkout --quiet FETCH_HEAD
    - git submodule update --init --depth=1 --jobs=4 -- ${SUBMODULES}
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: manual
  interruptible: true

build:
  extends: .common
  variables:
    JOB_COUNT: 32
    EXTRA_SCHEDULER_PARAMETERS: >-
      --partition=shared
      --ntasks=${JOB_COUNT}
      --time=20:00
    SPARSE_PATTERNS: >-
      /configure /utils/ /*.in /run/*.in /src/ /support/ /config/dkrz/
    SUBMODULES: ${BUILD_SUBMODULES}
    MAKEFLAGS: >-
      --jobs=${JOB_COUNT}
      --no-print-directory
      --output-sync=target
      V=1
  script:
    - ( set -x; "${CI_PROJECT_DIR}/config/dkrz/${CONFIG_WRAPPER}" ${CONFIG_ARGS} )
    - make
    - sed -i "s|${CI_PROJECT_DIR}|@CI_PROJECT_DIR@|g" run/SETUP.config
  artifacts:
    when: always
    paths:
      - "**/CMakeCache.txt"
      - "**/config.log"
      - bin/icon
      - externals/mtime/build/python/mtime
      - run/SETUP.config

.common_mkexp_run:
  extends: .common
  needs: [build]
  variables:
    CPU_SCHEDULER_PARAMETERS: >-
      --partition=compute
      --time=05:00
    GPU_SCHEDULER_PARAMETERS: >-
      --partition=gpu
      --gpus=4
      --exclusive
      --time=05:00
    SPARSE_PATTERNS: >-
      /utils/ /run/mkexp/
      /run/examples/${CI_JOB_NAME}.config
      /run/dict.iconam.mpim
      /run/add_run_routines
    SUBMODULES: utils/mkexp
    PYTHONPATH: ${CI_PROJECT_DIR}/externals/mtime/build/python
    MKEXP_PATH: ${CI_PROJECT_DIR}/run
  before_script:
    - !reference [.common, before_script]
    - sed -i "s|@CI_PROJECT_DIR@|${CI_PROJECT_DIR}|g" run/SETUP.config
    - module load python3
  script:
    - utils/mkexp/mkexp run/examples/${CI_JOB_NAME}.config WORK_ROOT='$MODEL_ROOT' DATA_ROOT='$MODEL_ROOT'
    - ./experiments/${CI_JOB_NAME}/scripts/${CI_JOB_NAME}.run_start

bubble:
  extends: .common_mkexp_run
