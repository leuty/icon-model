oes:omip:validation:gpu:lvec:build:
  extends: .nightly:oes:validation:gpu:build
  variables:
    LVECTOR_SWITCH: "bitid"

oes:omip:validation:cpu:V0:run:
  extends: .nightly:oes:validation:cpu:run
  needs: [oes:omip:validation:cpu:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V0_GM0_cpurun

oes:omip:validation:cpu:V1:run:
