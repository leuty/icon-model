include:
  - local: .gitlab/ci/common/dkrz.yml
  - local: .gitlab/ci/utils/icon.yml
  - local: .gitlab/ci/common/any-image.yml

.nightly:oes:validation:cpu:build:
  extends:
    - .common:dkrz:levante
    - .utils:icon:build
  stage: system
  needs: []
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 32
    ICON_CI_COMMON_DKRZ_SLURM_TIMELIMIT: "20:00"
    ICON_CI_UTILS_GIT_CLONE_PATH: ${ICON_CI_COMMON_DKRZ_SHMEM_PATH}/icon
    ICON_CI_UTILS_ICON_SOURCE_PATH: ${ICON_CI_UTILS_GIT_CLONE_PATH}
    LVECTOR_SWITCH: "no"
    FCFLAGS: -Minfo=inline -Mnofma
    ICON_CI_UTILS_ICON_CONFIG_REL_PATH: config/dkrz/levante.cpu.nvhpc-24.7
    ICON_CI_UTILS_ICON_CONFIG_EXTRA_ARGS: >-
      --disable-bundled-python
      --enable-ocean
      --enable-lvector=${LVECTOR_SWITCH}
      FCFLAGS="-I/sw/spack-levante/netcdf-fortran-4.6.1-y65bmi/include -g -O2 -Mrecursive -Mallocatable=03 -Mstack_arrays ${FCFLAGS}"
      PYTHON='/fastdata/mh0156/buildbot/venv/bin/python3'
    ICON_CI_UTILS_ICON_BUILD_JOB_COUNT: ${ICON_CI_COMMON_DKRZ_SLURM_NTASKS}
  before_script:
    - !reference [.common:dkrz:levante, before_script]
    - !reference [.utils:icon:build, before_script]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - !reference [.common:dkrz:levante, rules]
    - when: on_success

.nightly:oes:validation:gpu:build:
  extends: .nightly:oes:validation:cpu:build
  variables:
    FCFLAGS: >-
      -Minfo=accel,inline -acc=gpu,verystrict -Mnofma -gpu=cc80,cuda12.5,math_uniform
    ICON_CI_UTILS_ICON_CONFIG_REL_PATH: config/dkrz/levante.gpu.nvhpc-24.7

.nightly:oes:validation:cpu:run:
  extends: .common:dkrz:levante
  stage: system
  needs: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: shared,compute
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 4
    ICON_CI_COMMON_DKRZ_SLURM_TIMELIMIT: "10:00"
    ICON_CI_UTILS_GIT_SPARSE_PATTERNS: /run/
    HDF5_PLUGIN_PATH: /sw/spack-levante/netcdf-c-main-bdxvs5/plugins
    # The runscripts call srun with the --cpus-per-task argument which prevents
    # MPI processes from getting access to all allocated memory:
    SLURM_MEM_PER_CPU: 0
  before_script:
    - !reference [.common:dkrz:levante, before_script]
    - export PATH="/sw/spack-levante/cdo-2.2.2-4z4icb/bin:${PATH}"
    - export PATH="/fastdata/mh0156/buildbot/venv/bin:${PATH}"
  script:
    - |
      # !reference [.nightly:oes:validation:cpu:run, script]
      icon_ci_log_section_start "Running experiment '${CI_JOB_NAME}'" 'collapsed=false'
      (
        set -ux
        cp "${CI_PROJECT_DIR}/run/checksuite.ocean_internal/gpu/exp.${VAL_EXPERIMENT}.run" "${CI_PROJECT_DIR}/run/"
        basedir="${CI_PROJECT_DIR}" "${CI_PROJECT_DIR}/run/exp.${VAL_EXPERIMENT}.run"
        python3 ${CI_PROJECT_DIR}/run/checksuite.ocean_internal/gpu/result_hash_to_json.py \
          "experiments/${VAL_EXPERIMENT}/" "${VAL_EXPERIMENT}_" | \
          tee "${CI_PROJECT_DIR}/run/${VAL_EXPERIMENT}.json"
      ) 2>&1
      icon_ci_log_section_end
  artifacts:
    paths:
      - run/${VAL_EXPERIMENT}.json
    when: always
    expire_in: 30 min
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - !reference [.common:dkrz:levante, rules]
    - when: on_success

.nightly:oes:validation:gpu:run:
  extends: .nightly:oes:validation:cpu:run
  variables:
    ICON_CI_COMMON_DKRZ_SLURM_PARTITION: gpu
    ICON_CI_COMMON_DKRZ_SLURM_NTASKS: 2
    ICON_CI_COMMON_DKRZ_SLURM_GPUS_PER_NODE: 2
    # Levante GPU run wrapper does not handle non-exclusive allocations:
    ICON_CI_COMMON_DKRZ_SLURM_EXTRA_PARAMETERS: --exclusive

.nightly:oes:validation:analyze:
  extends: .common:any-image
  stage: system
  needs: []
  image: registry.gitlab.dkrz.de/icon/containers/icon-ci-analyze:f6633645
  variables:
    GIT_STRATEGY: none
  script:
    - |
      # !reference [.nightly:oes:validation:analyze, script]
      (
        set -u
        for f in 'cpurun_lvec' 'gpurun' 'gpurun_lvec'; do
          (
            set -x
            diff --unified --color=always \
              "${CI_PROJECT_DIR}/run/ocean_omip_R2B4_${COMPARISON_VARIANT}_GM0_cpurun.json" \
              "${CI_PROJECT_DIR}/run/ocean_omip_R2B4_${COMPARISON_VARIANT}_GM0_${f}.json"
          )
        done
      )
  rules: !reference [.nightly:oes:validation:cpu:run, rules]

oes:omip:validation:cpu:build:
  extends: .nightly:oes:validation:cpu:build

oes:omip:validation:cpu:lvec:build:
  extends: .nightly:oes:validation:cpu:build
  variables:
    LVECTOR_SWITCH: "bitid"

oes:omip:validation:gpu:build:
