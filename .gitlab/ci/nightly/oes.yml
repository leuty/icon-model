  needs: [oes:omip:validation:cpu:lvec:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V0_GM0_cpurun_lvec

oes:omip:validation:cpu:V1:lvec:run:
  extends: .nightly:oes:validation:cpu:run
  needs: [oes:omip:validation:cpu:lvec:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V1_GM0_cpurun_lvec

oes:omip:validation:gpu:V0:run:
  extends: .nightly:oes:validation:gpu:run
  needs: [oes:omip:validation:gpu:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V0_GM0_gpurun

oes:omip:validation:gpu:V1:run:
  extends: .nightly:oes:validation:gpu:run
  needs: [oes:omip:validation:gpu:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V1_GM0_gpurun

oes:omip:validation:gpu:V0:lvec:run:
  extends: .nightly:oes:validation:gpu:run
  needs: [oes:omip:validation:gpu:lvec:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V0_GM0_gpurun_lvec

oes:omip:validation:gpu:V1:lvec:run:
  extends: .nightly:oes:validation:gpu:run
  needs: [oes:omip:validation:gpu:lvec:build]
  variables:
    VAL_EXPERIMENT: ocean_omip_R2B4_V1_GM0_gpurun_lvec

oes:omip:validation:V0:analyze:
  extends: .nightly:oes:validation:analyze
  needs:
    - oes:omip:validation:cpu:V0:run
    - oes:omip:validation:cpu:V0:lvec:run
    - oes:omip:validation:gpu:V0:run
    - oes:omip:validation:gpu:V0:lvec:run
