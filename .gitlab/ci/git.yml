.git_sparse:
  variables:
    GIT_STRATEGY: empty
    SPARSE_PATTERNS:
    SUBMODULES:
  before_script:
    - module purge
    - module load git
    - git init --quiet .
    - git sparse-checkout set --no-cone -- ${SPARSE_PATTERNS}
    - git remote add origin "${CI_REPOSITORY_URL}"
    - git fetch --filter=blob:none --depth=1 --jobs=4 origin "${CI_COMMIT_SHA}"
    - git checkout --quiet FETCH_HEAD
    - git submodule update --init --depth=1 --jobs=4 -- ${SUBMODULES}

.git_jacamar:
  variables:
    GIT_DEPTH: 3
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_DEPTH: 1
    GIT_SUBMODULE_PATHS:
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs=4
