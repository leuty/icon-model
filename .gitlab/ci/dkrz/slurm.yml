.slurm_levante:
  variables:
    TEST_ACCOUNT: ka1125
    TEST_TASKS: 8
    TEST_PARTITION: shared,compute
    TEST_TIME_LIMIT: "05:00"
    EXTRA_SCHEDULER_PARAMETERS:
    SCHEDULER_PARAMETERS: >-
      --account=${TEST_ACCOUNT}
      --partition=${TEST_PARTITION}
      --ntasks=${TEST_TASKS}
      --time=${TEST_TIME_LIMIT}
      ${EXTRA_SCHEDULER_PARAMETERS}
